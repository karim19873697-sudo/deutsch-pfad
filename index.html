<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Deutsch Pfad — تعلّم الألمانية</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800&family=Nunito:wght@700;900&display=swap" rel="stylesheet">

<style>
:root{--bg:#fffaf3;--card:#fff;--tx:#1f2937;--mu:#6b7280;--bd:#e8e2d6;--red:#ff4d4f;--redd:#d9363e;--yel:#ffc800;--yeld:#d9a600;--grn:#2bc48a;--grnd:#1a9a69;--blu:#3b82f6;--blud:#2563eb;--pur:#8b5cf6;--sh:0 4px 0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#141418;--card:#1f1f26;--tx:#f5f3ee;--mu:#a1a1aa;--bd:#33333d;color-scheme:dark}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Nunito,Cairo,system-ui,sans-serif;font-weight:700;line-height:1.55}
#app{max-width:560px;margin:0 auto;min-height:100vh;padding:0 14px calc(92px + env(safe-area-inset-bottom,0px))}
button{font:inherit;color:inherit;cursor:pointer}
.btn{display:block;width:100%;border:0;border-radius:16px;padding:14px 18px;font-weight:900;font-size:17px;color:#fff;background:var(--grn);box-shadow:var(--sh) var(--grnd);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(4px);box-shadow:0 0 0 var(--grnd)}
.btn.red{background:var(--red);box-shadow:var(--sh) var(--redd)}.btn.blu{background:var(--blu);box-shadow:var(--sh) var(--blud)}
.btn.gh{background:var(--card);color:var(--tx);border:2px solid var(--bd);box-shadow:var(--sh) var(--bd)}
.btn:disabled{background:var(--bd);color:var(--mu);box-shadow:none;cursor:not-allowed}
.top{position:sticky;top:0;z-index:20;display:flex;gap:8px;align-items:center;justify-content:space-between;background:var(--bg);padding:10px 0;padding-top:calc(10px + env(safe-area-inset-top,0px));margin-top:calc(-1 * env(safe-area-inset-top,0px))}
.chip{display:inline-flex;gap:5px;align-items:center;background:var(--card);border:2px solid var(--bd);border-radius:14px;padding:4px 10px;font-weight:900}
.card{background:var(--card);border:2px solid var(--bd);border-radius:18px;padding:14px;margin:12px 0}
h1{font-size:26px;font-weight:900;margin:8px 0}h2{font-size:19px;margin:6px 0}
.mu{color:var(--mu);font-weight:600}.c{text-align:center}
.lvl{margin:26px 0 6px;text-align:center;font-weight:900;color:var(--mu);display:flex;align-items:center;gap:10px}.lvl:before,.lvl:after{content:"";flex:1;height:2px;background:var(--bd)}
.unit{border-radius:18px;padding:14px 16px;color:#fff;display:flex;justify-content:space-between;align-items:center;margin-top:18px}
.unit small{opacity:.85;font-weight:800}.unit button{background:rgba(255,255,255,.25);border:0;border-radius:12px;padding:8px 10px;color:#fff;font-weight:900}
.path{display:flex;flex-direction:column;align-items:center;gap:14px;padding:18px 0 4px}
.node{position:relative;width:76px;height:76px;border-radius:50%;border:0;font-size:30px;color:#fff;background:var(--grn);box-shadow:0 7px 0 var(--grnd);transform:translateX(var(--x));transition:transform .08s}
.node:active{transform:translateX(var(--x)) translateY(5px);box-shadow:0 2px 0 var(--grnd)}
.node.done{background:var(--yel);box-shadow:0 7px 0 var(--yeld)}.node.lock{background:var(--bd);box-shadow:0 7px 0 #cfc8b8;color:var(--mu)}
.node.exam{background:var(--pur);box-shadow:0 7px 0 #6d3fd1}.node.exam.lock{background:var(--bd);box-shadow:0 7px 0 #cfc8b8}
.node.cur:after{content:attr(data-go);position:absolute;top:-34px;left:50%;transform:translateX(-50%);background:var(--card);color:var(--grnd);border:2px solid var(--bd);border-radius:12px;padding:1px 10px;font-size:14px;font-weight:900;animation:bob 1s ease-in-out infinite;white-space:nowrap}
.node small{position:absolute;bottom:-8px;left:0;right:0;font-size:11px;letter-spacing:1px}
@keyframes bob{50%{transform:translateX(-50%) translateY(-5px)}}
.nav{position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--card);border-top:2px solid var(--bd);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px)}
.nav div{display:flex;max-width:560px;width:100%}.nav button{flex:1;border:0;background:none;padding:10px 0 8px;font-size:12px;font-weight:900;color:var(--mu)}
.nav button b{display:block;font-size:24px;line-height:1.1}.nav button.on{color:var(--blu)}
.ses{padding-top:calc(14px + env(safe-area-inset-top,0px));padding-bottom:240px}
.pb{flex:1;height:16px;background:var(--bd);border-radius:10px;overflow:hidden}.pb i{display:block;height:100%;background:var(--grn);border-radius:10px;transition:width .3s}
.x{background:none;border:0;font-size:26px;color:var(--mu)}
.ins{color:var(--mu);font-weight:900;margin:22px 0 6px}
.q{font-size:26px;font-weight:900;margin:6px 0 16px;unicode-bidi:plaintext}
.opt{display:block;width:100%;text-align:start;background:var(--card);border:2px solid var(--bd);border-radius:16px;padding:13px 16px;margin:9px 0;font-size:18px;font-weight:800;box-shadow:0 4px 0 var(--bd);unicode-bidi:plaintext}
.opt:active{transform:translateY(3px);box-shadow:0 1px 0 var(--bd)}
.opt.ok{border-color:var(--grn);background:rgba(43,196,138,.16);box-shadow:0 4px 0 var(--grnd)}.opt.bad{border-color:var(--red);background:rgba(255,77,79,.12);box-shadow:0 4px 0 var(--redd)}
.opt.sel{border-color:var(--blu);background:rgba(59,130,246,.1);box-shadow:0 4px 0 var(--blu)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid2 .opt{text-align:center;margin:0;font-size:38px}
.say{border:0;background:var(--blu);color:#fff;border-radius:14px;padding:6px 14px;font-size:20px;box-shadow:0 4px 0 var(--blud);margin:0 8px}
.bigsay{display:block;margin:20px auto;width:110px;height:110px;border-radius:30px;font-size:46px}
input.in{font:inherit;font-size:20px;width:100%;box-sizing:border-box;padding:13px;border-radius:14px;border:2px solid var(--bd);background:var(--card);color:var(--tx);direction:ltr;text-align:left}
.keys{display:flex;gap:8px;margin:10px 0}.keys button{flex:1;padding:10px;border-radius:12px;border:2px solid var(--bd);background:var(--card);font-size:20px;font-weight:900}
.chips{display:flex;gap:8px;flex-wrap:wrap;min-height:54px;padding:8px;border-bottom:2px solid var(--bd);direction:ltr;margin-bottom:12px}
.chips button{background:var(--card);border:2px solid var(--bd);border-radius:12px;padding:8px 12px;font-size:18px;font-weight:900;box-shadow:0 3px 0 var(--bd)}
.mt{display:grid;grid-template-columns:1fr 1fr;gap:10px}.mt button{background:var(--card);border:2px solid var(--bd);border-radius:14px;padding:12px 8px;font-size:17px;font-weight:800;box-shadow:0 3px 0 var(--bd);unicode-bidi:plaintext}
.mt button.p0{border-color:#3b82f6;background:rgba(59,130,246,.15)}.mt button.p1{border-color:#f97316;background:rgba(249,115,22,.15)}.mt button.p2{border-color:#8b5cf6;background:rgba(139,92,246,.15)}.mt button.p3{border-color:#ec4899;background:rgba(236,72,153,.15)}.mt button.p4{border-color:#14b8a6;background:rgba(20,184,166,.15)}
.mt button.sl{outline:3px solid var(--yel)}
.foot{position:fixed;left:0;right:0;bottom:0;z-index:40;padding:14px 14px calc(14px + env(safe-area-inset-bottom,0px));border-top:2px solid var(--bd);background:var(--bg)}
.foot>div{max-width:560px;margin:0 auto}
.foot.ok{background:#d7f7e8;border-color:#a7eccb;color:#0d5b3e}.foot.bad{background:#ffe1e1;border-color:#ffc2c2;color:#8a1f24}
.foot b{font-size:20px;display:block}.foot.ok .btn{box-shadow:var(--sh) var(--grnd)}.foot.bad .btn{background:var(--red);box-shadow:var(--sh) var(--redd)}
.foot{animation:up .25s}@keyframes up{from{transform:translateY(100%)}}
.cel{text-align:center;padding-top:30px}.stat{display:flex;gap:10px;justify-content:center;margin:16px 0;flex-wrap:wrap}
.stat div{border:2px solid var(--bd);border-radius:16px;padding:8px 14px;min-width:92px;background:var(--card)}.stat b{display:block;font-size:22px}
.stars{font-size:46px;letter-spacing:6px}
.ring{--p:0;width:96px;height:96px;border-radius:50%;margin:6px auto;background:conic-gradient(var(--yel) calc(var(--p)*1%),var(--bd) 0);display:grid;place-items:center}.ring span{width:74px;height:74px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-weight:900}
canvas#cf{position:fixed;inset:0;pointer-events:none;z-index:60}
.modal{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center}.modal>div{background:var(--card);border-radius:24px 24px 0 0;padding:20px;max-width:560px;width:100%;box-sizing:border-box;animation:up .25s;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))}
.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:#111;color:#fff;padding:10px 16px;border-radius:14px;z-index:80;max-width:88%;text-align:center}
.av{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}.av button{font-size:28px;border:2px solid var(--bd);background:var(--card);border-radius:14px;padding:6px}.av button.on{border-color:var(--blu)}
.week{display:flex;gap:8px;align-items:flex-end;height:90px}.week div{flex:1;text-align:center;font-size:11px}.week i{display:block;background:var(--yel);border-radius:6px 6px 0 0;min-height:4px}
.badges{display:flex;gap:10px;flex-wrap:wrap}.badges span{font-size:28px;padding:6px 10px;border:2px solid var(--bd);border-radius:14px}.badges .off{opacity:.25;filter:grayscale(1)}
.seg{display:flex;gap:8px}.seg button{flex:1;padding:10px;border-radius:12px;border:2px solid var(--bd);background:var(--card);font-weight:900}.seg button.on{border-color:var(--blu);background:rgba(59,130,246,.12)}
input.t{font:inherit;width:100%;box-sizing:border-box;padding:13px;margin:6px 0;border-radius:14px;border:2px solid var(--bd);background:var(--card);color:var(--tx)}
.cert{border:6px double var(--yeld);border-radius:18px;padding:30px 18px;text-align:center;background:var(--card)}
.de{direction:ltr;unicode-bidi:isolate;display:inline-block}
@media print{body *{visibility:hidden}.cert,.cert *{visibility:visible}.cert{position:absolute;inset:20px}}
</style>
</head>

const fnv=s=>{let h=0x811c9dc5;for(const b of new TextEncoder().encode(s)){h^=b;h=Math.imul(h,0x01000193)>>>0}return h.toString(16).padStart(8,'0')};

 tts(text)}

const tab=k=>{TAB=k;render()};
async function render(){if(!ME)return;S=null;cur=null;dir();
 if(TAB==='learn'){if(!PATH){app.innerHTML=topbar()+loader();try{PATH=await rpc('get_path')}catch(e){return toast(t('neterr'))}}app.innerHTML=topbar()+learnView()+nav();const c=$('.node.cur');if(c&&!window._sc){window._sc=1;c.scrollIntoView({block:'center'})}}
 else if(TAB==='practice')app.innerHTML=topbar()+practiceView()+nav();else app.innerHTML=topbar()+profileView()+nav()}
function learnView(){let h='',lv=-1,n=0,cr=null;const offs=[0,38,64,38,0,-38,-64,-38];
 PATH.forEach(u=>u.lessons.forEach(l=>{if(!cr&&l.open&&l.stars<0)cr=l.id}));
 PATH.forEach((u,ui)=>{if(u.level!==lv){lv=u.level;h+=`<div class="lvl">${t('level',{l:LVN[lv]})}</div>`}
  h+=`<div class="unit" style="background:${u.color}"><div><small>${LVN[u.level]} · ${t('unit')} ${ui+1}</small><div style="font-size:19px;font-weight:900">${u.icon||''} ${esc(tr(u.title))}</div></div>${u.tip?`<button onclick="tip(${u.id})">${t('tipb')}</button>`:''}</div><div class="path">`;
  u.lessons.forEach(l=>{const ex=l.kind==='exam',done=l.stars>=0,lock=!l.open&&!done,isCur=l.id===cr,off=ex?0:offs[(n++)%8];
   h+=`<button class="node ${ex?'exam':''} ${done?'done':''} ${lock?'lock':''} ${isCur?'cur':''}" style="--x:${off}px" ${isCur?`data-go="${t('start')}"`:''} onclick="${lock?'lockMsg()':`openLesson(${l.id})`}">${lock?'🔒':ex?'🏆':done?'⭐':'▶'}${done?`<small>${'★'.repeat(l.stars)}</small>`:''}</button>`});
  h+='</div>'});
 return h}
function tip(id){const u=PATH.find(x=>x.id===id);modal(`<h2>📘 ${esc(tr(u.title))}</h2><p style="font-size:18px">${esc(tr(u.tip))}</p><button class="btn" onclick="closeModal()">${t('got')}</button>`)}
function openLesson(id){const u=PATH.find(u=>u.lessons.some(l=>l.id===id)),l=u.lessons.find(l=>l.id===id),go=()=>startSession({mode:l.kind==='exam'?'exam':'lesson',id}),seen=JSON.parse(ls.get('tips')||'{}');
 if(u.tip&&!seen[u.id]&&l.stars<0){seen[u.id]=1;ls.set('tips',JSON.stringify(seen));window._go=go;modal(`<h2>📘 ${esc(tr(u.title))}</h2><p style="font-size:18px">${esc(tr(u.tip))}</p><button class="btn" onclick="closeModal();window._go()">${t('start')}</button>`)}else go()}
function practiceView(){const n=ME.due;return`<div class="c" style="padding-top:10px">${fox('happy',110)}<h1>${t('rev_t')}</h1><p class="mu">${n?t('rev_n',{n}):t('rev_none')}</p></div>${n?`<button class="btn" onclick="startSession({mode:'review'})">${t('rev_go')}</button>`:''}<div class="card mu">${t('rev_why')}</div>`}
const AV=['🦊','🐼','🦁','🐯','🐸','🐧','🦄','🐙','🦉','🐨','🐰','🐻'];
function profileView(){const m=ME,mx=Math.max(1,...m.week.map(d=>d.xp)),passed=[];if(PATH)PATH.forEach(u=>u.lessons.forEach(l=>{if(l.kind==='exam'&&l.stars>=0)passed.push(u.level)}));
 const B=[['🌱',m.xp>0,'b1'],['🔥',m.best_streak>=3,'b2'],['🔥🔥',m.best_streak>=7,'b3'],['⚡',m.xp>=100,'b4'],['🚀',m.xp>=500,'b5'],['🏆',passed.length>0,'b6']];
 return`<div class="c" style="padding-top:6px"><div style="font-size:64px">${m.avatar}</div><h1>${esc(m.name||'')}</h1><div class="mu">${t('level',{l:LVN[m.placement]})} · ${t('s_xp',{n:m.xp})}</div></div>
 <div class="card"><h2>${t('week')}</h2><div class="week">${m.week.map(d=>`<div><i style="height:${Math.round(80*d.xp/mx)}px"></i>${d.xp}</div>`).join('')}</div></div>
 <div class="card"><h2>${t('badges')}</h2><div class="badges">${B.map(b=>`<span class="${b[1]?'':'off'}" title="${t(b[2])}">${b[0]}</span>`).join('')}</div></div>
 ${passed.length?`<div class="card"><h2>${t('cert')}</h2>${passed.map(l=>`<button class="btn gh" style="margin:6px 0" onclick="cert(${l})">🎓 ${LVN[l]}</button>`).join('')}</div>`:''}
 <div class="card"><h2>${t('avatar')}</h2><div class="av">${AV.map(a=>`<button class="${a===m.avatar?'on':''}" onclick="setAv('${a}')">${a}</button>`).join('')}</div>
  <h2 style="margin-top:14px">${t('nm')}</h2><input class="t" id="pn" value="${esc(m.name||'')}"><button class="btn blu" onclick="saveName()">${t('save')}</button>
  <h2 style="margin-top:14px">${t('lang_set')}</h2><div class="seg">${LGS.map(l=>`<button class="${l===L?'on':''}" onclick="chLang('${l}')">${l.toUpperCase()}</button>`).join('')}</div>
  <h2 style="margin-top:14px">${t('goal_set')}</h2><div class="seg">${[10,20,40].map(g=>`<button class="${g===m.goal?'on':''}" onclick="setGoal(${g})">${g} XP</button>`).join('')}</div>
  <h2 style="margin-top:14px">${t('snd')}</h2><div class="seg"><button class="${SND?'on':''}" onclick="togSnd()">${SND?'🔊 ON':'🔇 OFF'}</button><button onclick="voiceTest()">${t('voice_test')}</button></div>
  <button class="btn gh" style="margin-top:14px" onclick="startSession({mode:'placement'})">${t('find_lvl')}</button></div>
 <details class="card"><summary><b>${t('about')}</b></summary><p class="mu">${t('srcn')}</p><ul class="mu"><li><a href="https://www.dinmedia.de/de/norm/din-5009/352073096" target="_blank" rel="noopener">DIN 5009:2022</a></li><li><a href="https://dmorgan.web.wesleyan.edu/materials/german.htm" target="_blank" rel="noopener">Wesleyan — Pronouncing German</a></li><li><a href="https://aleman.yabla.com/lesson-A-look-at-pronunciation-Part-1-1663" target="_blank" rel="noopener">Yabla — Ich-/Ach-Laute</a></li><li><a href="https://learngerman.dw.com" target="_blank" rel="noopener">DW Learn German</a> · <a href="https://www.goethe.de" target="_blank" rel="noopener">Goethe-Institut</a> · <a href="https://www.duden.de" target="_blank" rel="noopener">Duden</a></li></ul><p class="mu">${t('approx')}</p></details>
 <button class="btn gh" onclick="sb.auth.signOut()">${t('out')}</button>`}
async function upd(a){try{await rpc('update_profile',a);ME=await rpc('get_me')}catch(e){toast(t('neterr'))}}
const setAv=async a=>{await upd({p_avatar:a});render()},saveName=async()=>{await upd({p_name:$('#pn').value.trim()});toast('✓');render()},chLang=async l=>{L=l;ls.set('lang',l);dir();await upd({p_lang:l});PATH=null;render()},setGoal=async g=>{await upd({p_goal:g});render()},togSnd=()=>{SND=!SND;ls.set('snd',SND?'1':'0');render()};
function voiceTest(){speak('Guten Tag! Ich lerne Deutsch.');setTimeout(()=>toast(t('voices_n',{n:voices().length})),600)}

/* ===== جلسة التمارين ===== */
async function startSession(o){app.innerHTML=loader();let ex;
 try{ex=o.mode==='review'?await rpc('get_review',{p_lang:L,p_n:12}):o.mode==='placement'?await rpc('get_placement',{p_lang:L}):await rpc('get_lesson',{p_lesson:o.id,p_lang:L})}catch(e){toast(t('neterr'));return render()}
 if(!ex||!ex.length){toast(t('empty'));return render()}
 S={...o,run:(window.crypto&&crypto.randomUUID)?crypto.randomUUID():Date.now()+'-'+Math.random(),q:ex.slice(),total:ex.length,done:0,wrong:0,combo:0};next()}
function next(){if(!S.q.length)return finishSession();const x=S.q[0];cur={x,sel:null,words:[],pairs:x.kind==='match'?x.options.l.map(()=>null):null,selL:null,res:null,busy:false,ans:''};draw();if(/^i_listen/.test(x.ins||'')&&x.say)setTimeout(()=>speak(x.say),350)}
const isExam=()=>S.mode==='exam'||S.mode==='placement',listen=x=>/^i_listen/.test(x.ins||'');
function draw(){const x=cur.x,r=cur.res;
 let h=`<div class="ses"><div style="display:flex;gap:12px;align-items:center"><button class="x" onclick="quit()">✕</button><div class="pb"><i style="width:${100*S.done/S.total}%"></i></div></div><div class="ins">${t(x.ins||'i_pick')}</div>`;
 if(listen(x))h+=`<button class="say bigsay" data-say="${esc(x.say)}">🔊</button>`;
 else if(x.kind!=='match')h+=`<div class="q" dir="auto">${x.html?x.prompt:esc(x.prompt)}${x.say?`<button class="say" data-say="${esc(x.say)}">🔊</button>`:''}</div>`;
 if(x.kind==='mc'){const op=x.options.map((o,i)=>{let c='opt'+(cur.sel===i?' sel':'');if(r){if(o===r.correct)c='opt ok';else if(cur.sel===i)c='opt bad'}return`<button class="${c}" dir="auto" ${r?'disabled':''} onclick="pick(${i})">${esc(o)}</button>`}).join('');h+=x.big?`<div class="grid2">${op}</div>`:op}
 else if(x.kind==='type')h+=`<input class="in" id="ans" autocomplete="off" autocapitalize="off" spellcheck="false" ${r?`disabled value="${esc(cur.ans)}"`:''}><div class="keys">${['ä','ö','ü','ß'].map(c=>`<button onclick="addCh('${c}')">${c}</button>`).join('')}</div>`;
 else if(x.kind==='order')h+=`<div class="chips">${cur.words.map((w,k)=>`<button ${r?'disabled':''} onclick="rmW(${k})">${esc(x.options[w])}</button>`).join('')}</div><div class="chips" style="border:0">${x.options.map((w,i)=>cur.words.includes(i)?'':`<button ${r?'disabled':''} onclick="addW(${i})">${esc(w)}</button>`).join('')}</div>`;
 else{const L2=x.options.l,R2=x.options.r;h+='<div class="mt">'+L2.map((_,i)=>{const pj=cur.pairs[i],cl=pj!=null?'p'+i:(cur.selL===i?'sl':''),ri=cur.pairs.indexOf(i),cr=ri>=0?'p'+ri:'';return`<button class="${cl}" ${r?'disabled':''} dir="auto" onclick="tapL(${i})">${esc(L2[i])}</button><button class="${cr}" ${r?'disabled':''} dir="auto" onclick="tapR(${i})">${esc(R2[i])}</button>`}).join('')+'</div>'}
 h+='</div>';
 if(r&&!isExam()){const P=t('praise').split('|'),ok=r.ok;let det='';
  if(!ok){det=x.kind==='match'&&r.m?x.options.l.map((l,i)=>`<div class="de">${esc(l)} → ${esc(x.options.r[r.m[i]])}</div>`).join(''):`${t('ans')} <span class="de">${esc(r.correct)}</span>`}
  const nt=r.note_key?t(r.note_key):r.note?esc(r.note):'';
  h+=`<div class="foot ${ok?'ok':'bad'}"><div><b>${ok?P[Math.floor(Math.random()*P.length)]:t('wrong')} ${ok&&S.combo>=3?`<small>${t('combo',{n:S.combo})}</small>`:''}</b>${det}${r.after?`<button class="say" data-say="${esc(r.after)}" style="margin:6px 0">🔊 ${esc(r.after)}</button>`:''}${nt?`<div style="font-size:14px;margin:4px 0">${nt}</div>`:''}<button class="btn" style="margin-top:8px" onclick="next()">${t('cont')}</button></div></div>`}
 else{const ready=x.kind==='mc'?cur.sel!=null:x.kind==='type'?true:x.kind==='order'?cur.words.length>0:cur.pairs.every(p=>p!=null);
  h+=`<div class="foot"><div><button class="btn" ${ready?'':'disabled'} onclick="check()">${isExam()?t('cf'):t('chk')}</button>${listen(x)?`<button class="btn gh" style="margin-top:10px" onclick="skip()">${t('skip')}</button>`:''}</div></div>`}
 app.innerHTML=h;if(x.kind==='type'&&!r){const a=$('#ans');a&&a.focus()}}
const pick=i=>{if(!cur.res){cur.sel=i;sfx.tap();draw()}},addW=i=>{if(!cur.res){cur.words.push(i);sfx.tap();draw()}},rmW=k=>{if(!cur.res){cur.words.splice(k,1);draw()}};
const tapL=i=>{if(cur.res)return;if(cur.pairs[i]!=null)cur.pairs[i]=null;else cur.selL=i;draw()};
const tapR=j=>{if(cur.res||cur.selL==null)return;const k=cur.pairs.indexOf(j);if(k>=0)cur.pairs[k]=null;cur.pairs[cur.selL]=j;cur.selL=null;sfx.tap();draw()};
function addCh(c){const el=$('#ans');if(!el)return;const s=el.selectionStart==null?el.value.length:el.selectionStart,e=el.selectionEnd==null?s:el.selectionEnd;el.value=el.value.slice(0,s)+c+el.value.slice(e);el.focus();el.setSelectionRange(s+1,s+1)}
function skip(){S.q.shift();S.total=Math.max(1,S.total-1);next()}
function quit(){if(confirm(t('quit_q')))render()}
async function check(){const x=cur.x;if(cur.busy||cur.res)return;let a;
 if(x.kind==='mc'){if(cur.sel==null)return;a={p_choice:cur.sel}}
 else if(x.kind==='type'){const v=(($('#ans')||{}).value||'');if(!v.trim())return;cur.ans=v;a={p_text:v}}
 else if(x.kind==='order'){if(!cur.words.length)return;a={p_text:cur.words.map(i=>x.options[i]).join(' ')}}
 else{if(cur.pairs.some(p=>p==null))return;a={p_pairs:cur.pairs}}
 cur.busy=true;let r;try{r=await rpc('check_answer',{p_ex:x.id,p_lang:L,p_ctx:S.mode,p_run:S.run,...a})}catch(e){cur.busy=false;return toast(t('neterr'))}
 cur.busy=false;cur.res=r;S.q.shift();
 if(isExam()){S.done++;return next()}
 if(r.ok){S.combo++;S.done++;sfx.ok()}else{S.combo=0;S.wrong++;S.q.push(x);sfx.bad()}
 draw()}
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&S&&cur&&!e.isComposing){e.preventDefault();cur.res&&!isExam()?next():check()}});

/* ===== النهايات والاحتفال ===== */
async function finishSession(){app.innerHTML=loader();let r;
 try{
  if(S.mode==='placement'){const p=await rpc('finish_placement',{p_run:S.run});ME=await rpc('get_me');PATH=null;return placeRes(p.placement)}
  r=S.mode==='review'?await rpc('complete_review',{p_run:S.run}):await rpc('complete_lesson',{p_lesson:S.id,p_run:S.run});
  ME=await rpc('get_me');PATH=null;
 }catch(e){toast(t('neterr'));return render()}
 celebrate(r)}
function placeRes(p){sfx.done();confetti();app.innerHTML=`<div class="cel">${fox('happy',150)}<h1>${t('pl_res',{l:LVN[p]})}</h1></div><div class="foot ok"><div><button class="btn" onclick="TAB='learn';render()">${t('cont')}</button></div></div>`}
function celebrate(r){const ex=r.kind==='exam',ok=r.pass!==false;
 if(r.level_done){sfx.done();confetti();return levelDone(r)}
 if(ok){sfx.done();confetti()}else sfx.bad();
 const acc=r.total?Math.round(100*r.correct/r.total):100,left=Math.max(0,(r.goal||0)-(r.today||0));
 app.innerHTML=`<div class="cel">${fox(ok?'happy':'sad',150)}<h1>${ex&&!ok?t('cel_ex_fail'):ex?t('cel_ex_ok'):r.kind==='review'?t('cel_rev'):t('cel_ok')}</h1>${r.stars&&ok&&!ex?`<div class="stars">${'⭐'.repeat(r.stars)}</div>`:''}<div class="stat"><div><b>+${r.xp||0}</b>XP</div>${r.total?`<div><b>${acc}%</b>${t('acc')}</div>`:''}<div><b>🔥 ${r.streak||0}</b>${t('streak')}</div></div><div class="ring" style="--p:${Math.min(100,100*(r.today||0)/(r.goal||1))}"><span>${r.today||0}/${r.goal||0}</span></div><p class="mu">${left?t('goal_left',{n:left}):t('goal_done')}</p></div><div class="foot ${ok?'ok':'bad'}"><div><button class="btn" onclick="TAB='learn';render()">${t('cont')}</button></div></div>`}
function levelDone(r){const lv=r.level,nx=LVN[lv+1];app.innerHTML=`<div class="cel">${fox('happy',160)}<h1>${t('lvl_done',{l:LVN[lv]})}</h1><div class="stars">🏆</div><div class="stat"><div><b>+${r.xp}</b>XP</div><div><b>${Math.round(100*r.correct/Math.max(1,r.total))}%</b>${t('acc')}</div><div><b>🔥 ${r.streak}</b>${t('streak')}</div></div>${nx?`<p>${t('lvl_next',{l:nx})}</p>`:''}</div><div class="foot ok"><div><button class="btn gh" style="margin-bottom:10px" onclick="cert(${lv})">${t('cert')}</button><button class="btn" onclick="TAB='learn';render()">${nx?t('start_next',{l:nx}):t('cont')}</button></div></div>`}
function cert(lv){const d=new Date().toLocaleDateString(L==='ar'?'ar-DZ':L);app.innerHTML=`<div style="padding-top:20px"><div class="cert"><div style="font-size:50px">🎓</div><h2>${t('cert_t')}</h2><div style="font-size:30px;font-weight:900;margin:14px 0">${esc(ME.name||'')}</div><p>${t('cert_b',{l:LVN[lv]})}</p><div style="font-size:44px;font-weight:900;color:var(--red)">${LVN[lv]}</div><p class="mu">${d} · Deutsch Pfad 🇩🇪</p></div><button class="btn" style="margin-top:16px" onclick="print()">${t('print')}</button><button class="btn gh" style="margin-top:12px" onclick="render()">${t('back')}</button></div>`}
dir();boot();

</script>
</body>
